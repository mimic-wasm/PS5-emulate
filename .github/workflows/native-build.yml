name: Build Windows input bridge

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish input bridge
        run: dotnet publish native/InputBridge/InputBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/publish
